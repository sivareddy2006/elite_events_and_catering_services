<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Events &amp; Catering Services</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="login-page">

    <!-- Main Content -->
    <main>

        <!-- Login Section -->
        <section class="login-section">

            <!-- Login Form -->
            <form class="login-card" action="home.html" method="get">

                <h1>Login Required</h1>

                <p>
                    Please login to enter
                    <strong>Elite Events &amp; Catering Services</strong>.
                </p>

                <label>
                    Name
                    <input
                        type="text"
                        name="name"
                        placeholder="Your Name"
                        required
                    >
                </label>

                <label>
                    Email
                    <input
                        type="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </label>

                <label>
                    Password
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                    >
                </label>

                <button class="primary-link" type="submit">
                    Enter Website
                </button>

            </form>

        </section>

    </main>

</body>

</html>
