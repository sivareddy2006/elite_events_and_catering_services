<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Events &amp; Catering Services</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-page">
  <main>
    <section class="login-section">
      <form class="login-card" action="home.html" method="get">
        <h1>Login Required</h1>
        <p>Please login to enter Elite Events &amp; Catering Services.</p>
        <label>Name <input name="name" required placeholder="Your name"></label>
        <label>Email <input name="email" type="email" required placeholder="you@example.com"></label>
        <label>Password <input name="password" type="password" required placeholder="Password"></label>
        <button class="primary-link" type="submit">Enter Website</button>
      </form>
    </section>
  </main>
</body>
</html>
